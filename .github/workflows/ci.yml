name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tracko_test
          POSTGRES_USER: tracko
          POSTGRES_PASSWORD: tracko_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracko -d tracko_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:lifecycle:db
        env:
          TEST_DATABASE_URL: postgresql://tracko:tracko_test_password@localhost:5432/tracko_test
