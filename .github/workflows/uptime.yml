name: Uptime

# Fails when the API health check or the website is down, so GitHub emails the account
# that owns this schedule. Free; GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: API health
        run: |
          for attempt in 1 2 3; do
            body=$(curl --silent --show-error --max-time 30 https://trackoapi.vercel.app/v1/health) \
              && echo "$body" | grep -q '"ok":true' && echo "API healthy" && exit 0
            echo "Attempt $attempt failed; retrying in 20 s"
            sleep 20
          done
          echo "::error::https://trackoapi.vercel.app/v1/health is down or not ok"
          exit 1
      - name: Website
        run: |
          for attempt in 1 2 3; do
            curl --fail --silent --show-error --output /dev/null --max-time 30 https://www.trako.com.ng/ \
              && echo "Website up" && exit 0
            echo "Attempt $attempt failed; retrying in 20 s"
            sleep 20
          done
          echo "::error::https://www.trako.com.ng is down"
          exit 1
